[package]
name = "curion"
version = "0.1.2"
edition = "2021"
authors = ["kako-jun"]
description = "A SF collection game where you gather particles of curiosity"
license = "MIT"
homepage = "https://github.com/kako-jun/curion"
repository = "https://github.com/kako-jun/curion"
readme = "README.md"
keywords = ["game", "tui", "collection", "nostr"]
categories = ["command-line-utilities", "games"]
exclude = [".github/", "target/"]
rust-version = "1.78.0"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
uuid = { version = "1.11", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
anyhow = "1.0"
dirs = "5.0"
nostr-sdk = "0.37"
clap = { version = "4.5", features = ["derive"] }
rustyline = "14.0"
tokio = { version = "1.42", features = ["full"] }

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
