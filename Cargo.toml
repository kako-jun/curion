[package]
name = "curion"
version = "0.1.0"
edition = "2021"
authors = ["kako-jun"]
description = "A SF collection game where you gather particles of curiosity"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
uuid = { version = "1.11", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
anyhow = "1.0"
